version: 2

updates:
  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    groups:
      node-dev:
        dependency-type: development
      node-prod:
        dependency-type: production
